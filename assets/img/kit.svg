<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="TikTok Shop Starter Kit">
  <defs>
    <radialGradient id="bg" cx=".38" cy=".32" r=".85">
      <stop offset="0" stop-color="#fdfcf9"/>
      <stop offset=".55" stop-color="#efece5"/>
      <stop offset="1" stop-color="#ddd8cd"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1f"/>
      <stop offset=".55" stop-color="#111114"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a42"/>
      <stop offset=".6" stop-color="#232329"/>
      <stop offset="1" stop-color="#151519"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0c0f"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d929a"/>
      <stop offset=".3" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#b9bec6"/>
      <stop offset=".8" stop-color="#f2f4f6"/>
      <stop offset="1" stop-color="#7c8189"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a60"/>
      <stop offset=".5" stop-color="#d91e36"/>
      <stop offset="1" stop-color="#7e0918"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <g opacity=".5" stroke="#c9c3b7" stroke-width="1">
    <path d="M0 150h1200M0 300h1200M0 450h1200M0 600h1200M0 750h1200"/>
    <path d="M150 0v900M300 0v900M450 0v900M600 0v900M750 0v900M900 0v900M1050 0v900"/>
  </g>

  <ellipse cx="600" cy="700" rx="330" ry="52" fill="#141416" opacity=".22" filter="url(#shadow)"/>

  <g transform="translate(600 430)">
    <!-- box top -->
    <polygon points="0,-170 250,-92 0,-14 -250,-92" fill="url(#top)"/>
    <!-- box left -->
    <polygon points="-250,-92 0,-14 0,222 -250,144" fill="url(#side)"/>
    <!-- box right -->
    <polygon points="250,-92 0,-14 0,222 250,144" fill="url(#front)"/>
    <!-- chrome edges -->
    <polygon points="0,-170 250,-92 0,-14 -250,-92" fill="none" stroke="url(#chrome)" stroke-width="3"/>
    <path d="M-250,-92 0,-14 0,222" fill="none" stroke="url(#chrome)" stroke-width="2.5" opacity=".85"/>
    <path d="M250,-92 0,-14" fill="none" stroke="url(#chrome)" stroke-width="2" opacity=".5"/>

    <!-- red band across front -->
    <polygon points="0,64 250,146 250,198 0,116" fill="url(#red)"/>
    <polygon points="0,64 250,146 250,152 0,70" fill="#ff6b7c" opacity=".55"/>

    <!-- front typography -->
    <g transform="translate(58 24) skewY(18.6)">
      <text x="0" y="0" font-family="Arial Black, Arial, sans-serif" font-size="34" letter-spacing="1" fill="#f7f5ef">TIKTOK KIT</text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="15" letter-spacing="5" fill="#a8a49b">PIXSALE / 2026</text>
    </g>
    <g transform="translate(186 150) skewY(18.6)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" letter-spacing="3" fill="#ffd9de">START SELLING</text>
    </g>

    <!-- left side label -->
    <g transform="translate(-214 10) skewY(-18.6)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" letter-spacing="4" fill="#6f6a62">DIGITAL GOODS</text>
      <text x="0" y="30" font-family="Arial Black, Arial, sans-serif" font-size="22" fill="#3b3b41">01</text>
    </g>

    <!-- chrome sticker -->
    <g transform="translate(196 -58)">
      <rect x="0" y="0" width="66" height="66" rx="12" fill="url(#chrome)"/>
      <path d="M20 48V19h12c6 0 10 3.6 10 9.3 0 5.8-4 9.4-10 9.4h-4.6V48H20Z" fill="#0e0e10"/>
      <path d="M27.4 33.1v-6.7h4c2 0 3.2 1.2 3.2 3.3s-1.2 3.4-3.2 3.4h-4Z" fill="#e9ebee"/>
    </g>
  </g>

  <!-- corner marks -->
  <g fill="#0e0e10" opacity=".55">
    <rect x="52" y="52" width="10" height="10"/>
    <rect x="1138" y="838" width="10" height="10"/>
  </g>
  <text x="52" y="836" font-family="Arial, sans-serif" font-size="15" letter-spacing="4" fill="#8a857c">PIXSALE STUDIO — PRODUCT 01</text>
</svg>
