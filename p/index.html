<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กำลังโหลด — PIXSALE</title>
<meta name="description" content="">
<meta name="theme-color" content="#fbfaf7">
<meta property="og:type" content="website">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="/assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/assets/img/og.png">
<link rel="icon" type="image/svg+xml" href="../assets/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Thai:wght@300;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/page.css">
<style>
  [hidden] { display: none !important; }
  body { background: #fbfaf7; }
  .ps-boot { min-height: 100vh; display: grid; place-items: center; padding: 30px; }
  .ps-boot-inner { text-align: center; width: 210px; }
  .ps-boot-mark { width: 46px; height: 46px; margin: 0 auto 18px; border-radius: 12px; box-shadow: 0 14px 30px -16px rgba(14,14,16,.4); }
  .ps-boot-bar { height: 2px; background: #e8e2d8; border-radius: 2px; overflow: hidden; margin-top: 16px; }
  .ps-boot-bar i { display: block; width: 40%; height: 100%; background: #d91e36; border-radius: 2px; animation: boot 1.1s cubic-bezier(.22,1,.36,1) infinite; }
  @keyframes boot { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  .ps-boot p { font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: #938e85; margin-top: 12px; }
  .ps-error { min-height: 100vh; display: grid; place-items: center; padding: 30px 22px; background: #f4f2ed; }
  .ps-error-inner { max-width: 440px; text-align: center; }
  .ps-error .code { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .16em; color: #a50f22; }
  .ps-error h1 { font-family: "IBM Plex Sans Thai", sans-serif; font-size: clamp(30px, 8vw, 44px); font-weight: 300; letter-spacing: -.03em; line-height: 1.15; margin: 14px 0 10px; color: #0e0e10; }
  .ps-error p { font-size: 13.5px; line-height: 1.75; color: #726e67; }
  .ps-error .actions { display: flex; gap: 8px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
  .ps-error .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border-radius: 999px; font-family: "IBM Plex Sans Thai", sans-serif; font-size: 13px; font-weight: 500; background: #0e0e10; color: #f4f2ed; }
  .ps-error .btn.ghost { background: transparent; color: #0e0e10; border: 1px solid #c6c0b4; }
  .ps-draft-bar { position: sticky; top: 0; z-index: 60; background: #fff3cd; color: #6b4b00; font-family: "IBM Plex Mono", monospace; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; text-align: center; padding: 8px 12px; border-bottom: 1px solid #efdba0; }
  .ps-toast { position: fixed; left: 50%; bottom: 84px; translate: -50% 0; background: #0e0e10; color: #f4f2ed; font-family: "IBM Plex Sans Thai", sans-serif; font-size: 12px; padding: 9px 14px; border-radius: 999px; z-index: 100; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  .ps-toast.on { opacity: 1; }
  .ps-page { min-height: 100vh; }
</style>
</head>
<body data-base="../">

<div class="ps-boot" id="boot">
  <div class="ps-boot-inner">
    <img class="ps-boot-mark" src="../assets/brand/logo.svg" alt="PIXSALE">
    <div class="ps-boot-bar"><i></i></div>
    <p>Loading sales page</p>
  </div>
</div>

<div id="draftBar"></div>
<div id="pageRoot"></div>

<div class="ps-error" id="errorState" hidden>
  <div class="ps-error-inner">
    <div class="code" id="errCode">404 / NOT FOUND</div>
    <h1 id="errTitle">ไม่พบหน้านี้</h1>
    <p id="errCopy">ลิงก์อาจถูกเปลี่ยนชื่อ หรือหน้านี้ยังไม่ได้เผยแพร่จาก PIXSALE Studio</p>
    <div class="actions">
      <a class="btn" href="../app/">เปิด PIXSALE Studio</a>
      <a class="btn ghost" href="../">กลับหน้าแรก</a>
    </div>
  </div>
</div>

<div class="ps-toast" id="toast">คัดลอกลิงก์แล้ว</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/github.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/render.js"></script>
<script src="../assets/js/pix-tracking.js"></script>
<script src="../assets/js/public.js"></script>
</body>
</html>
